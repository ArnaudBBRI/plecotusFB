<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#080908">
  <title>Plecotus · Accueil</title>
  <link rel="stylesheet" href="assets/branding/plecotus-bat.css">
  <link rel="stylesheet" href="welcome.css">
  <script defer src="welcome.js"></script>
</head>
<body>
  <section class="welcome" id="welcome" data-state="loading" aria-label="Bienvenue dans Plecotus">
    <button class="welcome-bat" id="enter-dashboard" type="button" aria-label="Ouvrir le tableau de bord Plecotus" disabled>
      <img class="plecotus-bat" id="bat-logo" src="assets/branding/plecotus-bat-v1.png"
        width="1774" height="887" alt="" fetchpriority="high" decoding="async">
      <span class="logo-fallback" id="logo-fallback" hidden>plecotus</span>
    </button>
    <p class="welcome-hint" aria-hidden="true">Cliquez sur la chauve-souris pour commencer</p>
    <p class="visually-hidden" id="welcome-status" role="status">Chargement de Plecotus…</p>
  </section>
  <main class="dashboard" id="dashboard" tabindex="-1" aria-label="Tableau de bord Plecotus" hidden>
    <header class="dashboard-header">
      <nav class="dashboard-menu" aria-label="Menu principal">
        <button class="file-button" id="load-file" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4m-4 4 4-4 4 4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
          </svg>
          <span>Charger un fichier csv</span>
        </button>
        <input id="data-file" type="file" accept=".csv,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="Choisir un fichier CSV ou Excel" hidden>
        <p class="selected-file" id="selected-file" role="status" hidden></p>
      </nav>
      <span class="wordmark">plecotus</span>
    </header>
    <h1 class="visually-hidden">Tableau de bord</h1>
  </main>
  <noscript><p class="noscript-message">Activez JavaScript pour ouvrir Plecotus.</p></noscript>
</body>
</html>
