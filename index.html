<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080908">
  <title>Plecotus · Welcome</title>
  <link rel="stylesheet" href="assets/branding/plecotus-bat.css">
  <link rel="stylesheet" href="welcome.css">
  <script defer src="welcome.js"></script>
</head>
<body>
  <section class="welcome" id="welcome" data-state="loading" aria-label="Welcome to Plecotus">
    <button class="welcome-bat" id="enter-dashboard" type="button" aria-label="Enter Plecotus dashboard" disabled>
      <img class="plecotus-bat" id="bat-logo" src="assets/branding/plecotus-bat-v1.png"
        width="1774" height="887" alt="" fetchpriority="high" decoding="async">
      <span class="logo-fallback" id="logo-fallback" hidden>plecotus</span>
    </button>
    <p class="welcome-hint" aria-hidden="true">Click the bat to begin</p>
    <p class="visually-hidden" id="welcome-status" role="status">Loading Plecotus…</p>
  </section>
  <main class="dashboard" id="dashboard" tabindex="-1" aria-label="Plecotus dashboard" hidden>
    <header class="dashboard-header"><span class="wordmark">plecotus</span><h1>Dashboard</h1></header>
  </main>
  <noscript><p class="noscript-message">Enable JavaScript to open Plecotus.</p></noscript>
</body>
</html>
