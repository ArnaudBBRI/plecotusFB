<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Plecotus · Logo illumination</title>
  <link rel="stylesheet" href="assets/branding/plecotus-bat.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #080908;
      color: #e8e4dc;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 2rem clamp(1.25rem, 5vw, 4rem);
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 500; letter-spacing: .08em; }
    header p { margin: 0; color: #96968e; font-size: .8rem; }
    main { display: grid; place-items: center; padding: 1rem clamp(1.25rem, 5vw, 4rem); }
    .plecotus-bat { width: min(100%, 1050px, max(16rem, calc(200svh - 36rem))); }
    footer { display: grid; justify-items: center; gap: .85rem; padding: 2rem 1.25rem 3rem; }
    button {
      padding: .8rem 1.2rem;
      border: 1px solid #48473f;
      border-radius: 999px;
      background: #181916;
      color: inherit;
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
    }
    button:hover { background: #24251f; border-color: #898273; }
    button:focus-visible { outline: 2px solid #c99662; outline-offset: 5px; }
    #logo-status { min-height: 1.2em; margin: 0; color: #96968e; font-size: .75rem; }
    @media (max-width: 420px) { header { align-items: flex-start; flex-direction: column; gap: .5rem; } }
  </style>
  <noscript><style>.plecotus-bat { animation: plecotus-light-on 1.6s ease-in-out both; }</style></noscript>
</head>
<body>
  <header><h1>plecotus</h1><p>Logo illumination</p></header>
  <main>
    <img class="plecotus-bat" id="bat-logo" src="assets/branding/plecotus-bat-v1.png"
      width="1774" height="887" alt="A long-eared bat with outstretched wings, shaded in copper and brown facets"
      fetchpriority="high" decoding="async">
  </main>
  <footer>
    <button type="button" id="replay" disabled><span aria-hidden="true">↻</span> Replay illumination</button>
    <p id="logo-status" role="status">Loading logo…</p>
  </footer>
  <script>
    const logo = document.getElementById('bat-logo');
    const replay = document.getElementById('replay');
    const status = document.getElementById('logo-status');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function illuminate() {
      logo.classList.remove('is-illuminating');
      // Restart the CSS animation, including when replayed before it finishes.
      void logo.offsetWidth;
      logo.classList.add('is-illuminating');
      status.textContent = reducedMotion.matches ? 'Reduced motion: logo shown immediately.' : '1.6-second illumination';
    }

    function ready() {
      replay.disabled = false;
      illuminate();
    }

    function failed() {
      status.textContent = 'The logo could not be loaded. Keep the assets folder beside this page.';
    }

    replay.addEventListener('click', illuminate);
    reducedMotion.addEventListener('change', () => {
      if (!replay.disabled) illuminate();
    });
    logo.decode().then(ready, failed);
  </script>
</body>
</html>
